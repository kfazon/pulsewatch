name: CI/CD Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r requirements-dev.txt && playwright install
    # Legacy application modules do not yet have a clean full-repo Ruff baseline.
    # Keep this change gated without rewriting unrelated runtime code.
    - name: Lint landing regression test
      run: python -m ruff check tests/test_public_landing.py && python -m ruff format --check tests/test_public_landing.py
    - name: Test
      run: python -m pytest tests/ -v --tb=short
