# PulseWatch Apache production directives.
# The HTTP vhost must join the server's IP-specific name-vhost set; `*:80`
# loses routing precedence to unrelated `164.68.100.134:80` vhosts.
# Required declaration: <VirtualHost 164.68.100.134:80>
#
# Keep these rules immediately after `RewriteEngine on` in both HTTP and HTTPS
# vhosts, before other host rules.
RewriteCond %{HTTP_HOST} ^(?:www\.)?pulsewatch\.top$ [NC]
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} ^www\.pulsewatch\.top$ [NC]
RewriteRule ^ https://pulsewatch.top%{REQUEST_URI} [R=301,L,NE]
