# Canonical public host rules for both HTTP and HTTPS vhosts.
# Keep these immediately after `RewriteEngine on` and before other host rules.
RewriteCond %{HTTP_HOST} ^(?:www\.)?pulsewatch\.top$ [NC]
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} ^www\.pulsewatch\.top$ [NC]
RewriteRule ^ https://pulsewatch.top%{REQUEST_URI} [R=301,L,NE]
