# Prevent private runtime state and environment files from being served.
# The directory must be traversable and the JSON file writable by the
# PulseWatch PHP-FPM account (`pulsewatch` in production); keep the file 0600.
SetEnv PULSEWATCH_SUBSCRIBERS_FILE /var/lib/pulsewatch/subscribers.json

<Directory "/home/pulsewatch/public_html">
    Options -Indexes
    <FilesMatch "^(subscribers\.json|\.env.*)$">
        Require all denied
    </FilesMatch>
</Directory>
